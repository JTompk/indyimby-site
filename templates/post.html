<main class="article">
  <p class="post-date">{{date}}</p>
  <h1>{{title}}</h1>
  <div class="prose">{{body}}</div>
  <div class="post-subscribe">
    <h3>Get this every Monday</h3>
    <p>Every new rezoning, variance, and tax abatement in Indianapolis —
    mapped and explained, free.</p>
    <form action="https://buttondown.email/api/emails/embed-subscribe/jefferytompkins"
          method="post" target="_blank">
      <input type="email" name="email" placeholder="you@example.com"
             aria-label="Email address" required>
      <button type="submit">Subscribe</button>
    </form>
  </div>
  <p class="article-foot"><a href="/digest/">← All digests</a> ·
  <a href="{{map_url}}">Open the live map</a> ·
  <a href="{{map_url}}/build">What can you build on your lot?</a></p>
</main>
<script>
/* Digest use-case filter. The chips are plain anchor links (they still
   jump to the section without JS / in email); with JS they narrow the
   docket to one category and mirror the choice into the URL hash. */
(function(){
  var chips=[].slice.call(document.querySelectorAll('.chips .chip'));
  if(!chips.length) return;
  function apply(cat){
    chips.forEach(function(c){c.classList.toggle('is-on',c.getAttribute('data-cat')===cat)});
    var any=false;
    [].forEach.call(document.querySelectorAll('.dk'),function(li){
      var on=(cat==='all'||li.getAttribute('data-cat')===cat); li.hidden=!on; if(on) any=true;
    });
    [].forEach.call(document.querySelectorAll('.docket'),function(ul){
      var show=!!ul.querySelector('.dk:not([hidden])'); ul.hidden=!show;
      var p=ul.previousElementSibling;
      while(p&&(p.classList.contains('dk-desc')||p.classList.contains('dk-h'))){p.hidden=!show;p=p.previousElementSibling;}
      var n=ul.nextElementSibling; if(n&&n.classList.contains('dk-more')) n.hidden=!show;
    });
    [].forEach.call(document.querySelectorAll('.dk-empty'),function(e){e.classList.toggle('show',!any)});
  }
  chips.forEach(function(c){
    c.addEventListener('click',function(e){
      e.preventDefault(); var cat=c.getAttribute('data-cat'); apply(cat);
      try{history.replaceState(null,'',cat==='all'?location.pathname:'#'+cat)}catch(err){}
    });
  });
  var h=location.hash.replace('#','');
  if(h&&chips.some(function(c){return c.getAttribute('data-cat')===h})) apply(h);
})();
</script>
